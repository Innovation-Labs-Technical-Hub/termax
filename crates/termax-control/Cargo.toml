[package]
name = "termax-control"
description = "Termax local control endpoint: JSON-RPC 2.0 over a per-user Unix socket or named pipe, client pairing and tokens, scopes, approvals, audit, and the headless runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
termax-core.workspace = true
termax-interop.workspace = true
termax-policy.workspace = true
termax-session.workspace = true
termax-ssh.workspace = true
termax-vault.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
base64 = "0.22"
directories = "6"
hex = "0.4"
# Client tokens come from the OS CSPRNG.
getrandom = "0.4"
# Only SHA-256 hashes of client tokens are stored.
sha2 = "0.10"
subtle = "2"
zeroize = "1"
# Client tokens live in the OS keychain: macOS Keychain, Windows Credential
# Manager, Linux kernel keyutils (no D-Bus or C dependency).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Named pipes with a security descriptor, without `unsafe` in this crate.
[target.'cfg(windows)'.dependencies]
interprocess = { version = "2", features = ["tokio"] }
widestring = "1"

[dev-dependencies]
termax-sshd-fixture.workspace = true
tempfile.workspace = true
