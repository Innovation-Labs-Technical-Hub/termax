[package]
name = "termax-ssh"
description = "Termax SSH client facade over russh: hardened crypto policy, host-key trust, auth, channels, -L forwarding and ProxyJump"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
termax-vault.workspace = true
thiserror.workspace = true
# 0.64.1 is the security floor; stay on the latest 0.65.x.
russh = "0.65.4"
regex-lite = "0.1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util", "fs"] }
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
termax-sshd-fixture = { path = "../termax-sshd-fixture" }
termax-interop.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "process"] }
