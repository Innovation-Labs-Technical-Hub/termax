[package]
name = "oxt-cli"
description = "oxt — OxTerm command-line tool sharing the local vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxt"
path = "src/main.rs"

[dependencies]
oxt-core.workspace = true
oxt-interop.workspace = true
oxt-policy.workspace = true
oxt-vault.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
rpassword = "7"
serde.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
