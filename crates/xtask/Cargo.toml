[package]
name = "xtask"
description = "Termax developer tasks: performance harness and budget gate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
termax-term.workspace = true
termax-ssh.workspace = true
termax-sshd-fixture.workspace = true
termax-term-ghostty = { path = "../termax-term-ghostty", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memory-stats = "1"
serde.workspace = true
serde_json = "1"

[features]
# Adds `--backend ghostty`; needs Zig 0.15.2 on PATH.
ghostty = ["dep:termax-term-ghostty"]

[lints]
workspace = true
