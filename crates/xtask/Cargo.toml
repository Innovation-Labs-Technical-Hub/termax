[package]
name = "xtask"
description = "OxTerm developer tasks: performance harness and budget gate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
oxt-term = { path = "../oxt-term" }
oxt-ssh = { path = "../oxt-ssh" }
oxt-sshd-fixture = { path = "../oxt-sshd-fixture" }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memory-stats = "1"
serde.workspace = true
serde_json = "1"

[lints]
workspace = true
