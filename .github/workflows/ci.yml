name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare sshd for interop tests
        if: runner.os == 'Linux'
        run: |
          [ -x /usr/sbin/sshd ] || { sudo apt-get update && sudo apt-get install -y openssh-server; }
          # Ubuntu's sshd refuses to start without its privilege-separation directory.
          sudo mkdir -p /run/sshd
      # Default members only: the Ghostty backend needs Zig and has its own job.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  ghostty:
    # Experimental backend; built on Linux only until other platforms are verified.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo clippy -p termax-term-ghostty -p termax-term-ghostty-sys --all-targets -- -D warnings
      - run: cargo test -p termax-term-ghostty
      - name: Backend comparison (report only)
        run: cargo run --release -p xtask --features ghostty -- perf --no-ssh --backend ghostty
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  perf:
    # Gate: fail when a stable metric regresses more than 10% against the PR's
    # base commit measured on the same runner. Targets from the architecture
    # brief are reported but not enforced (`--check` would enforce them).
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare sshd for SSH measurements
        run: |
          [ -x /usr/sbin/sshd ] || { sudo apt-get update && sudo apt-get install -y openssh-server; }
          sudo mkdir -p /run/sshd
      - name: Measure base commit
        if: github.event_name == 'pull_request'
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          if [ -d "$RUNNER_TEMP/base/crates/xtask" ]; then
            (cd "$RUNNER_TEMP/base" && cargo xtask perf --no-ssh --json "$GITHUB_WORKSPACE/base.json") \
              || echo "::warning::base commit perf run failed; no regression gate this time"
          else
            echo "::notice::base commit has no perf harness; no regression gate this time"
          fi
      - name: Measure this commit
        run: |
          args=(--json perf.json)
          if [ -f base.json ]; then args+=(--baseline base.json); fi
          cargo xtask perf "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: |
            perf.json
            base.json
          if-no-files-found: ignore
