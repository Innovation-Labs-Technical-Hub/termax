[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
termax-core = { path = "crates/termax-core" }
termax-policy = { path = "crates/termax-policy" }
termax-interop = { path = "crates/termax-interop" }
termax-vault = { path = "crates/termax-vault" }
termax-term = { path = "crates/termax-term" }
termax-ssh = { path = "crates/termax-ssh" }
termax-session = { path = "crates/termax-session" }
termax-control = { path = "crates/termax-control" }
termax-sshd-fixture = { path = "crates/termax-sshd-fixture" }
termax-term-ghostty = { path = "crates/termax-term-ghostty" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library code must not panic on fallible input or print to stdout. Tests
# are exempt through clippy.toml; binaries and test support opt out at the
# crate root with a reason.
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
